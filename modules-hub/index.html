<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pit Box – modules</title>
<!-- Page d'accueil du site : les modules Pure Racing présentés sur un volant.
     Écran central = Dash ; boutons = Spotter et Engineer ; poignées = FFB Lab
     et Analyzer (le volant tourne) ; molettes = Engine (vibre) et Motion
     (bouge) ; logo du bas = Pit Box. Survol = fiche, clic = page du module.
     Liens : renseigner LIENS ci-dessous (adresse de la page Odoo de chaque module). -->
<style>
:root{--bg:#070E2A;--panel:#101A3C;--border:#33405F;--text:#FCFDFD;--muted:#98A4C2;--info:#4CC9FF;--accent:#FD1424}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px "Segoe UI",system-ui,sans-serif}
.stage{position:relative;max-width:1240px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:270px minmax(0,1fr) 270px;gap:18px;align-items:start}
.wheelbox{grid-column:2;min-width:0}
svg{display:block;width:100%;height:auto;overflow:visible;-webkit-tap-highlight-color:transparent}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}

/* Volant : animations par module (origine = centre du volant) */
#wheel{transform-box:view-box;transform-origin:500px 330px;transition:transform .5s ease}
.act-engine #wheel{animation:shake .09s linear infinite}
.act-motion #wheel{animation:motion 2.6s ease-in-out infinite}
.act-lab #wheel{animation:steer 3.2s ease-in-out infinite}
.act-analyzer #wheel{animation:kick 1.9s ease-out infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(1.6px,-1.2px)}50%{transform:translate(-1.4px,1.4px)}75%{transform:translate(1.2px,1.5px)}100%{transform:translate(0,0)}}
@keyframes motion{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-14px,-10px) rotate(-3deg)}50%{transform:translate(0,12px) rotate(0)}75%{transform:translate(14px,-6px) rotate(3deg)}}
@keyframes steer{0%,100%{transform:rotate(0)}30%{transform:rotate(-32deg)}70%{transform:rotate(32deg)}}
@keyframes kick{0%{transform:rotate(0)}8%{transform:rotate(22deg)}18%{transform:rotate(-14deg)}28%{transform:rotate(9deg)}38%{transform:rotate(-5deg)}50%{transform:rotate(2deg)}62%,100%{transform:rotate(0)}}
.waves circle{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.act-engine .waves circle{animation:wave 1s ease-out infinite}
.act-engine .waves circle:nth-child(2){animation-delay:.33s}.act-engine .waves circle:nth-child(3){animation-delay:.66s}
@keyframes wave{0%{r:30;opacity:.9}100%{r:95;opacity:0}}
.waves{pointer-events:none}

/* Zones survolables */
.hot{cursor:pointer;outline:none}
.hot .zone{fill:transparent;stroke:transparent;stroke-width:3;transition:stroke .2s,fill .2s}
.hot:hover .zone,.hot.on .zone,.hot:focus-visible .zone{stroke:var(--accent);fill:rgba(253,20,36,.08)}
.hot.stand:hover .zone,.hot.stand.on .zone,.hot.stand:focus-visible .zone{stroke:var(--info);fill:rgba(76,201,255,.08)}
.ping{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:0;animation:ping 2.4s ease-out infinite;pointer-events:none}
.stand .ping{stroke:var(--info)}
.hot.on .ping{animation:none}
/* le volant bouge pour ces modules : pas de cadre fixe par-dessus */
.act-lab .hot.on .zone,.act-analyzer .hot.on .zone,.act-engine .hot.on .zone,.act-motion .hot.on .zone{stroke:transparent;fill:transparent}
@keyframes ping{0%{opacity:.85;transform:scale(.6)}70%,100%{opacity:0;transform:scale(1.25)}}
.ping{transform-box:fill-box;transform-origin:center}
.btn-lit{transition:filter .2s}
.hot.on .btn-lit,.hot:hover .btn-lit{filter:drop-shadow(0 0 8px rgba(253,20,36,.9))}

/* Écran */
.scr text{font-family:"Bahnschrift","Segoe UI",system-ui,sans-serif}
.scr [data-v]{display:none}
.scr[data-mode="dash"] [data-v="dash"],.scr[data-mode="engine"] [data-v="engine"],.scr[data-mode="motion"] [data-v="motion"],
.scr[data-mode="lab"] [data-v="lab"],.scr[data-mode="analyzer"] [data-v="analyzer"],.scr[data-mode="spotter"] [data-v="spotter"],
.scr[data-mode="engineer"] [data-v="engineer"],.scr[data-mode="pitbox"] [data-v="pitbox"]{display:inline}

/* Fiche */
.card{position:absolute;width:270px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s,top .25s;pointer-events:none;z-index:3}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card::before{content:"";position:absolute;top:var(--ay,40px);width:14px;height:14px;background:var(--panel);border:1px solid var(--border);transform:rotate(45deg)}
.card.left::before{right:-8px;border-left:0;border-bottom:0}
.card.right::before{left:-8px;border-right:0;border-top:0}
.fam{display:flex;align-items:center;gap:8px;font:700 11.5px "Segoe UI",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fam i{width:9px;height:9px;border-radius:50%;background:var(--text)}
.fam.piste i{background:var(--accent)}.fam.stand i{background:var(--info)}
.card h2{margin:0;font:800 26px "Bahnschrift","Segoe UI",system-ui,sans-serif;letter-spacing:.02em}
.card h2 .s{color:var(--muted);font-weight:400;margin:0 .2em}.card h2 .n{color:var(--accent)}
.card p{margin:0;line-height:1.55;color:#DCE2F0;font-size:14.5px}
.where{font-size:12.5px;color:var(--muted)}
.soon{display:inline-block;background:var(--accent);color:#fff;font:800 11px "Segoe UI",system-ui,sans-serif;letter-spacing:.08em;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:4px}
.go{align-self:flex-start;background:var(--accent);color:#fff;text-decoration:none;font:700 13.5px "Segoe UI",system-ui,sans-serif;border-radius:999px;padding:9px 16px}
.go:hover{filter:brightness(1.12)}
.go.off{background:transparent;border:1px solid var(--border);color:var(--muted);cursor:default}

@media (max-width:980px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .wheelbox{grid-column:1}
  .card{position:relative;width:auto;left:auto!important;top:auto!important;opacity:1;transform:none;pointer-events:auto}
  .card::before{display:none}
}
@media (prefers-reduced-motion:reduce){#wheel{animation:none!important}.ping,.waves circle{animation:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">

            <text x="404" y="216" font-size="13" fill="#98A4C2">LAP 7</text><text x="596" y="216" font-size="13" fill="#98A4C2" text-anchor="end">P3</text>

            <path d="M462,268 L538,268 M500,230 L500,306" stroke="#33405F" stroke-width="1.5"/>

          <circle cx="370" cy="368" r="15" fill="#2B3040"/><circle cx="370" cy="368" r="9" fill="#4C5366"/>
          <circle cx="630" cy="368" r="15" fill="#2B3040"/><circle cx="630" cy="368" r="9" fill="#4C5366"/>
        </g>

        <text x="560" y="452" font-size="12" font-weight="700" fill="#98A4C2" text-anchor="middle" letter-spacing="1.5" font-family="Segoe UI,system-ui,sans-serif">MOTION</text>

<script>
// Adresse de la page de chaque module sur le site (vide = « page bientôt en ligne »).
const LIENS = { pitbox:'', dash:'', spotter:'', engineer:'', lab:'', analyzer:'', engine:'', motion:'' };

// Zones : forme (rect x,y,w,h,rx ou circle cx,cy,r), famille, fiche.
const MODS = [
  {id:'dash', nom:'Dash', fam:'piste', shape:['rect',384,158,232,176,14], where:'L\'écran central et les LED',
   txt:"Tableaux de bord et LED pensés pour la lisibilité en course : rapports, deltas, carburant, drapeaux et rivaux en un coup d'œil."},
  {id:'spotter', nom:'Spotter', fam:'piste', soon:true, shape:['circle',345,232,38], where:'Le bouton radio de gauche',
   txt:"Un équipier à la radio : il annonce les voitures à vos côtés, les écarts et les drapeaux. Un bouton du volant lui est réservé."},
  {id:'engineer', nom:'Engineer', fam:'stand', shape:['circle',655,232,38], where:'Le bouton radio de droite',
   txt:"Votre ingénieur de piste : il compare vos tours, lit votre setup, analyse pneus, freins et suspensions, puis propose réglages et stratégie carburant."},
  {id:'lab', nom:'FFB Lab', fam:'stand', shape:['rect',136,150,92,360,44], where:'La poignée gauche',
   txt:"Un laboratoire pour calculer, comparer et valider sur piste vos réglages de force feedback, en quatre étapes guidées."},
  {id:'analyzer', nom:'Analyzer', fam:'stand', shape:['rect',772,150,92,360,44], where:'La poignée droite',
   txt:"Mesure en direct le couple réel de votre volant, détecte la saturation et vous aide à régler votre force feedback sans écrêtage."},
  {id:'engine', nom:'Engine', fam:'piste', shape:['circle',440,404,40], where:'La molette ENGINE',
   txt:"Génère automatiquement des profils moteurs adaptés à chaque voiture et exploite pleinement vos bass shakers et équipements haptiques."},
  {id:'motion', nom:'Motion', fam:'piste', shape:['circle',560,404,40], where:'La molette MOTION',
   txt:"Analyse en temps réel les données physiques de vos jeux et les convertit en mouvements sur 6 axes, transmis directement à OpenTrack."},
  {id:'pitbox', nom:'Pit Box', fam:'centre', shape:['rect',438,462,124,52,12], where:'Le logo du volant',
   txt:"Le plugin SimHub qui réunit tous les modules Pure Racing : une seule installation, un seul menu, et chaque module s'active d'un clic."},
];
const FAM = {piste:'En piste', stand:'Au stand', centre:'Le plugin qui centralise tout'};

const NS = 'http://www.w3.org/2000/svg';
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const svg = document.getElementById('svg'), stage = document.getElementById('stage'), card = document.getElementById('card'), scr = document.getElementById('scr');

// LED de régime
const leds = document.getElementById('leds'), LED = [];
for (let i = 0; i < 15; i++) LED.push(el('circle', {cx: 402 + i * 14100 / 1000, cy: 175, r: 5, fill: '#1B2030'}, leds));
const ledColor = i => i < 5 ? '#3BE37A' : i < 10 ? '#FD1424' : '#4CC9FF';

// Zones survolables
const hots = document.getElementById('hots');
const touch = matchMedia('(hover: none)').matches;
MODS.forEach(m => {
  const g = el('g', {class: 'hot ' + m.fam, tabindex: 0, role: 'link', 'aria-label': m.nom}, hots);
  const s = m.shape;
  const z = s[0] === 'rect' ? el('rect', {x:s[1], y:s[2], width:s[3], height:s[4], rx:s[5], class:'zone'}, g)
                            : el('circle', {cx:s[1], cy:s[2], r:s[3], class:'zone'}, g);
  const c = s[0] === 'rect' ? [s[1] + s[3] / 2, s[2] + s[4] / 2] : [s[1], s[2]];
  if (m.id !== 'dash' && m.id !== 'pitbox') el('circle', {cx:c[0], cy:c[1], r: s[0] === 'rect' ? 22 : s[3], class:'ping'}, g);
  m.g = g; m.zone = z;
  g.addEventListener('mouseenter', () => pick(m, true));
  g.addEventListener('focus', () => pick(m, true));
  g.addEventListener('click', () => { if (touch && cur !== m) { pick(m, true); return; } open(m); });
  g.addEventListener('keydown', e => { if (e.key === 'Enter') open(m); });
});
function open(m) { const u = LIENS[m.id]; if (u) window.top.location.href = u; }

let cur = null, auto = true, idle;
function pick(m, user) {
  if (user) { auto = false; clearTimeout(idle); idle = setTimeout(() => { auto = true; }, 10000); }
  if (cur === m) return; cur = m;
  MODS.forEach(x => { x.g.classList.toggle('on', x === m); stage.classList.toggle('act-' + x.id, x === m); });
  scr.dataset.mode = m.id;
  const u = LIENS[m.id];
  card.innerHTML =
    `<div class="fam ${m.fam}"><i></i>${FAM[m.fam]}</div>` +
    `<h2>${m.id === 'pitbox' ? '<span class="n">PIT</span> BOX' : `PURE<span class="s">|</span><span class="n">${m.nom.toUpperCase()}</span>`}${m.soon ? '<span class="soon">BIENTÔT</span>' : ''}</h2>` +
    `<p>${m.txt}</p><div class="where">Sur le volant : ${m.where.charAt(0).toLowerCase() + m.where.slice(1)}</div>` +
    (u ? `<a class="go" href="${u}" target="_top">Découvrir ${m.nom}</a>` : `<span class="go off">Page bientôt en ligne</span>`);
  place();
}
// Fiche à côté de l'élément survolé (à gauche ou à droite du volant) ; sous le volant sur petit écran.
function place() {
  if (!cur || innerWidth <= 980) { card.classList.add('show'); return; }
  const r = cur.zone.getBoundingClientRect(), st = stage.getBoundingClientRect(), wb = svg.getBoundingClientRect();
  const cx = r.left + r.width / 2, left = cx < wb.left + wb.width / 2;
  const top = Math.max(10, Math.min(r.top + r.height / 2 - st.top - 50, st.height - card.offsetHeight - 10));
  card.classList.toggle('left', left); card.classList.toggle('right', !left);
  card.style.left = (left ? 16 : st.width - 270 - 16) + 'px';
  card.style.top = top + 'px';
  card.style.setProperty('--ay', Math.max(18, Math.min(r.top + r.height / 2 - st.top - top - 7, card.offsetHeight - 30)) + 'px');
  card.classList.add('show');
}
addEventListener('resize', place);

// Vie de l'écran : rapports, régime, G, couple.
let t = 0, gear = 3;
const gearEl = document.getElementById('gear'), speedEl = document.getElementById('speed'), wave = document.getElementById('eng-wave'),
      gdot = document.getElementById('gdot'), bar = document.getElementById('ffbbar'), ffbt = document.getElementById('ffbtxt');
function tick() {
  t += 1;
  const rev = (t % 40) / 40;
  LED.forEach((l, i) => l.setAttribute('fill', i / 15 < rev ? ledColor(i) : '#1B2030'));
  if (t % 40 === 0) { gear = gear >= 6 ? 3 : gear + 1; gearEl.textContent = gear; }
  speedEl.textContent = Math.round(150 + gear * 18 + rev * 22);
  let d = 'M404,268'; for (let x = 0; x <= 192; x += 4) d += ` L${404 + x},${268 + Math.sin((x + t * 9) / 7) * 18 * Math.sin(x / 192 * Math.PI)}`;
  wave.setAttribute('d', d);
  gdot.setAttribute('cx', 500 + Math.sin(t / 9) * 26); gdot.setAttribute('cy', 268 + Math.sin(t / 5.5) * 18);
  const nm = 4.5 + Math.abs(Math.sin(t / 7)) * 3.6; bar.setAttribute('width', nm / 9.4 * 180);
  ffbt.textContent = nm.toFixed(1).replace('.', ',') + ' Nm · pas d\'écrêtage';
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
tick(); if (!reduce) setInterval(tick, 60);

const ORDER = ['pitbox','dash','spotter','engineer','lab','analyzer','engine','motion'].map(id => MODS.find(m => m.id === id));
let k = 0; pick(ORDER[0]);
if (!reduce) setInterval(() => { if (!auto) return; k = (k + 1) % ORDER.length; pick(ORDER[k]); }, 4200);
document.getElementById('hint').textContent = touch ? 'Touchez un élément du volant · touchez à nouveau pour ouvrir sa page'
                                                    : 'Survolez le volant · cliquez pour ouvrir la page du module';
</script>
</body>
