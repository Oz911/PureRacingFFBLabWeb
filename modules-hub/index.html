<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volant Pit Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:ital,wght@0,600;0,800;1,800&display=swap">
<style>
/* Mise en page : volant au centre sur fond blanc, fiche du module à gauche ou à droite
   (sous le volant sur téléphone), barre des 8 icônes en dessous. Un seul thème, clair, voulu. */
:root{
  --bg:#FFFFFF; --ink:#0B1433; --ink-2:#4A5675; --line:#E2E6EF; --soft:#F4F6FA;
  --red:#FD1424; --blue:#1C9BE0; --badge:#0B1433;
  --display:"Barlow Semi Condensed","Bahnschrift","Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:16px/1.5 var(--body)}
.stage{position:relative;max-width:1280px;margin:0 auto;padding-block:34px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:280px minmax(0,1fr) 280px;gap:12px}
.wheelbox{grid-column:2;min-width:0}
svg.wheel{display:block;width:100%;height:auto;overflow:visible;-webkit-tap-highlight-color:transparent}

/* Volant : mouvements par module */
#wheel{transform-box:view-box;transform-origin:800px 600px;transition:transform .5s ease}
.act-engine #wheel{animation:shake .09s linear infinite}
.act-motion #wheel{animation:motion 2.8s ease-in-out infinite}
.act-lab #wheel{animation:steer 3.4s ease-in-out infinite}
.act-analyzer #wheel{animation:kick 2s ease-out infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(3px,-2px)}50%{transform:translate(-2.5px,2.5px)}75%{transform:translate(2px,3px)}100%{transform:translate(0,0)}}
@keyframes motion{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-26px,-18px) rotate(-3deg)}50%{transform:translate(0,22px) rotate(0)}75%{transform:translate(26px,-10px) rotate(3deg)}}
@keyframes steer{0%,100%{transform:rotate(0)}30%{transform:rotate(-18deg)}70%{transform:rotate(18deg)}}
@keyframes kick{0%{transform:rotate(0)}8%{transform:rotate(14deg)}18%{transform:rotate(-9deg)}28%{transform:rotate(6deg)}38%{transform:rotate(-4deg)}50%{transform:rotate(1.5deg)}62%,100%{transform:rotate(0)}}
.waves circle{fill:none;stroke:var(--red);stroke-width:5;opacity:0;pointer-events:none}
.act-engine .waves circle{animation:wave 1s ease-out infinite}
.act-engine .waves circle:nth-child(2){animation-delay:.33s}.act-engine .waves circle:nth-child(3){animation-delay:.66s}
@keyframes wave{0%{r:60;opacity:.9}100%{r:190;opacity:0}}

/* Zones survolables (fixes, hors du volant qui bouge) */
.hot{cursor:pointer;outline:none}
.hot .zone{fill:transparent;stroke:transparent;stroke-width:5;transition:stroke .2s,fill .2s}
.hot:hover .zone,.hot.on .zone,.hot:focus-visible .zone{stroke:var(--red);fill:rgba(253,20,36,.07)}
.hot.stand:hover .zone,.hot.stand.on .zone,.hot.stand:focus-visible .zone{stroke:var(--blue);fill:rgba(28,155,224,.08)}
.act-lab .hot.on .zone,.act-analyzer .hot.on .zone,.act-engine .hot.on .zone,.act-motion .hot.on .zone{stroke:transparent;fill:transparent}
.ping{fill:none;stroke:var(--red);stroke-width:4;opacity:0;animation:ping 2.6s ease-out infinite;pointer-events:none;transform-box:fill-box;transform-origin:center}
.stand .ping{stroke:var(--blue)}
.hot.on .ping{animation:none}
@keyframes ping{0%{opacity:.9;transform:scale(.7)}70%,100%{opacity:0;transform:scale(1.25)}}
.badge-lit{transition:filter .2s}
.lit .badge-lit{filter:drop-shadow(0 0 14px rgba(253,20,36,.95))}

/* Écran du volant */
.scr text{font-family:var(--display);font-weight:600}
.scr [data-v]{display:none}
.scr[data-mode="dash"] [data-v="dash"],.scr[data-mode="engine"] [data-v="engine"],.scr[data-mode="motion"] [data-v="motion"],
.scr[data-mode="lab"] [data-v="lab"],.scr[data-mode="analyzer"] [data-v="analyzer"],.scr[data-mode="spotter"] [data-v="spotter"],
.scr[data-mode="engineer"] [data-v="engineer"],.scr[data-mode="pitbox"] [data-v="pitbox"]{display:inline}

/* Fiche */
.card{position:absolute;width:280px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 34px rgba(11,20,51,.14);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s,top .25s;pointer-events:none;z-index:3}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card::before{content:"";position:absolute;top:var(--ay,40px);width:14px;height:14px;background:var(--bg);border:1px solid var(--line);transform:rotate(45deg)}
.card.left::before{right:-8px;border-left:0;border-bottom:0}
.card.right::before{left:-8px;border-right:0;border-top:0}
.head{display:flex;align-items:center;gap:12px}
.ico{flex:none;width:48px;height:48px;border-radius:50%;background:var(--badge);display:grid;place-items:center}
.ico svg{width:28px;height:28px}
.fam{font:600 11.5px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.fam i{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.fam.piste i{background:var(--red)}.fam.stand i{background:var(--blue)}
.card h2{margin:2px 0 0;font:800 24px/1.05 var(--display);letter-spacing:.01em;text-transform:uppercase}
.card h2 .s{color:var(--line);font-weight:600;margin:0 .18em}.card h2 .n{color:var(--red)}
.card p{margin:0;color:var(--ink-2);font-size:15px;max-width:40ch}
.where{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:9px}
.where b{color:var(--ink);font-weight:600}
.soon{display:inline-block;background:var(--red);color:#fff;font:700 11px var(--body);letter-spacing:.08em;border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:5px}
.go{align-self:flex-start;background:var(--red);color:#fff;text-decoration:none;font:600 14px var(--body);border-radius:999px;padding:9px 16px}
.go:hover,.go:focus-visible{background:#D90E1C}
.go.off{background:var(--soft);color:var(--ink-2);cursor:default}

/* Barre des icônes */
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 14px 5px 5px;font:600 14px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.chip .ico{width:34px;height:34px}.chip .ico svg{width:20px;height:20px}
.chip:hover,.chip:focus-visible,.chip.on{border-color:var(--red);outline:none}
.chip.stand:hover,.chip.stand:focus-visible,.chip.stand.on{border-color:var(--blue)}
.hint{grid-column:1/-1;text-align:center;font-size:13px;color:var(--ink-2)}

@media (max-width:1000px){
  .stage{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center;padding-block:24px 18px}
  .wheelbox{grid-column:1}
  .card{position:relative;width:auto;left:auto!important;top:auto!important;opacity:1;transform:none;pointer-events:auto;box-shadow:none}
  .card::before{display:none}
}
@media (max-width:600px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .bar{order:2}.card{order:3}.hint{order:4}
  .bar{display:grid;grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.chip{padding:4px 10px 4px 4px;font-size:12.5px}.chip .ico{width:28px;height:28px}.chip .ico svg{width:17px;height:17px}}
@media (prefers-reduced-motion:reduce){#wheel{animation:none!important}.ping,.waves circle{animation:none!important}}
</style>

</head>

            <rect x="790" y="325" width="36" height="86" rx="12" fill="#FFFFFF"/>
            <rect x="710" y="350" width="36" height="86" rx="12" fill="#FD1424"/>
            <text x="807" y="500" font-size="36" fill="#FD1424" text-anchor="middle">VOITURE À GAUCHE</text>
          </g>
          <g data-v="engineer">
            <text x="807" y="300" font-size="24" fill="#8A93A8" text-anchor="middle">ENGINEER · RADIO</text>
            <text x="807" y="380" font-size="32" fill="#FFFFFF" text-anchor="middle">« L'arrière décroche en entrée »</text>
            <text x="807" y="442" font-size="32" fill="#1C9BE0" text-anchor="middle">→ Aileron arrière +1</text>
            <text x="807" y="510" font-size="21" fill="#8A93A8" text-anchor="middle">Carburant : 4,15 L / tour · 23 tours</text>
          </g>
          <g data-v="pitbox">
            <g id="pbico" transform="translate(759,300) scale(4)"></g>
            <text x="807" y="460" font-size="46" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">PIT BOX</text>
            <text x="807" y="506" font-size="22" fill="#8A93A8" text-anchor="middle">7 modules · 1 plugin SimHub</text>
          </g>
        </g>
        <!-- pastilles Spotter / Engineer posées sur deux boutons du volant -->
        <g class="badge-lit" id="b-spotter"></g>
        <g class="badge-lit" id="b-engineer"></g>
        <!-- étiquettes des molettes (à la place des lettres) -->
        <g font-family="Barlow Semi Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="27" text-anchor="middle" letter-spacing="2">
          <rect x="545" y="786" width="134" height="42" rx="8" fill="#07090F"/><text x="612" y="817" fill="#FFFFFF">ENGINE</text>
          <rect x="938" y="786" width="134" height="42" rx="8" fill="#07090F"/><text x="1005" y="817" fill="#FFFFFF">MOTION</text>
        </g>
      </g>
      <g class="waves"><circle cx="605" cy="695"/><circle cx="605" cy="695"/><circle cx="605" cy="695"/></g>
      <g id="hots"></g>
    </svg>
  </div>
  <section class="card" id="card" aria-live="polite"></section>
  <nav class="bar" id="bar" aria-label="Modules"></nav>
  <div class="hint" id="hint"></div>
</div>

<script>
// Pages des modules sur le site (vide = pas encore en ligne).
const SITE = 'https://pureracing-fx.odoo.com';
const LIENS = { pitbox:'', dash:'/pure-dash', spotter:'', engineer:'/pure-engineer', lab:'/mon-reglage-ffb',
                analyzer:'/pure-ffb-analyzer', engine:'/pure-engine', motion:'/pure-motion' };

// Icônes Pure Racing (grille 24 × 24, trait blanc, accent rouge).
const W = 'fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const R = 'fill="none" stroke="#FD1424" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  pitbox: `<rect x="3.5" y="3.5" width="17" height="17" rx="3" ${W}/><path d="M9.5 17V7h3.8a3 3 0 0 1 0 6H9.5" ${R} stroke-width="2.2"/>`,
  dash: `<rect x="3" y="8" width="18" height="12" rx="2.5" ${W}/><path d="M6 4.5h.01M9.3 4.5h.01M12.6 4.5h.01M15.9 4.5h.01M19 4.5h.01" ${R} stroke-width="2.6"/><path d="M8 17a4 4 0 0 1 8 0" ${W}/><path d="M12 17l2.6-2.6" ${R}/>`,
  spotter: `<rect x="9.5" y="4.5" width="5" height="15" rx="2" ${W}/><path d="M10.5 9h3" ${W} stroke-width="1.4"/><path d="M6.3 8.5a5 5 0 0 0 0 7M17.7 8.5a5 5 0 0 1 0 7" ${R}/><path d="M3.3 6a9 9 0 0 0 0 12M20.7 6a9 9 0 0 1 0 12" ${R} opacity=".5"/>`,
  engineer: `<path d="M4.5 14v-2a7.5 7.5 0 0 1 15 0v2" ${W}/><path d="M4.5 13.5h2.5v5.5H5.5a1 1 0 0 1-1-1zM19.5 13.5H17v5.5h1.5a1 1 0 0 0 1-1z" ${W}/><path d="M17 19c0 1.4-1.4 2-3.4 2h-1.1" ${W}/><path d="M8.8 12.5h1.4l1-2.2 1.8 4.2 1-2h1.2" ${R}/>`,
  lab: `<path d="M9 3h6M10 3v6.2L5 18a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-8.8V3" ${W}/><path d="M7.3 15h9.4" ${R}/><path d="M10.5 18h.01M13.5 17.5h.01" ${R} stroke-width="2.4"/>`,
  analyzer: `<circle cx="12" cy="12" r="8.8" ${W}/><circle cx="12" cy="12" r="2.6" ${W}/><path d="M3.4 12h6M14.6 12h6M12 14.6v6.2" ${W}/><path d="M5.8 6.2A8.8 8.8 0 0 1 18.2 6.2" ${R} stroke-width="2.6"/>`,
  engine: `<rect x="8" y="3.5" width="8" height="7" rx="1.2" ${W}/><path d="M8 6h8M12 10.5v4.5" ${W}/><circle cx="12" cy="17.5" r="2.6" ${W}/><path d="M4.5 7.5q-1.6 2.25 0 4.5t0 4.5M19.5 7.5q1.6 2.25 0 4.5t0 4.5" ${R}/>`,
  motion: `<path d="M3 16.5l9 4 9-4-9-4z" ${W}/><path d="M12 3v7.5M9.6 5.4L12 3l2.4 2.4" ${R}/><path d="M5.2 10.3c1.6 1 4 1.6 6.8 1.6s5.2-.6 6.8-1.6" ${W} stroke-dasharray="1.6 2.2"/>`,
};
const icon = id => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg>`;

// Zones sur la photo (coordonnées de l'image d'origine 1600 × 1200).
const MODS = [
  {id:'pitbox', nom:'Pit Box', fam:'centre', shape:['circle',808,712,88], where:'le sélecteur central',
   txt:"Le plugin SimHub qui réunit tous les modules Pure Racing : une seule installation, un seul menu, chaque module s'active d'un clic."},
  {id:'dash', nom:'Dash', fam:'piste', shape:['rect',540,190,534,360,20], where:"l'écran et les LED",
   txt:"Le plugin indispensable pour profiter pleinement des dashboards Pure Racing FX : rapports, deltas, carburant, drapeaux et rivaux d'un coup d'œil."},
  {id:'spotter', nom:'Spotter', fam:'piste', soon:true, shape:['circle',470,422,56], where:'le bouton radio gauche',
   txt:"Un équipier à la radio : il annonce les voitures à vos côtés, les écarts et les drapeaux. Un bouton du volant lui est réservé."},
  {id:'engineer', nom:'Engineer', fam:'stand', shape:['circle',1142,420,56], where:'le bouton radio droit',
   txt:"Analysez et comparez vos sessions, puis optimisez vos setups : pneus, freins, suspensions, réglages proposés et stratégie carburant."},
  {id:'lab', nom:'FFB Lab', fam:'stand', shape:['rect',72,560,236,480,60], where:'la poignée gauche',
   txt:"Un module pour calculer, comparer et valider sur piste vos réglages de force feedback, en quatre étapes guidées."},
  {id:'analyzer', nom:'FFB Analyzer', fam:'stand', shape:['rect',1296,560,236,480,60], where:'la poignée droite',
   txt:"Un module de monitoring pour vous aider à régler votre base direct drive : couple mesuré en direct, saturation détectée."},
  {id:'engine', nom:'Engine', fam:'piste', shape:['circle',605,695,92], where:'la molette ENGINE',
   txt:"Générez automatiquement des profils moteurs adaptés à chaque voiture et exploitez pleinement vos équipements haptiques."},
  {id:'motion', nom:'Motion', fam:'piste', shape:['circle',1005,695,92], where:'la molette MOTION',
   txt:"Analyse en temps réel les données physiques de vos jeux et les convertit en mouvements sur 6 axes, transmis directement à OpenTrack."},
];
const FAM = {piste:'En piste', stand:'Réglages et analyse', centre:'Le plugin central'};

const NS = 'http://www.w3.org/2000/svg';
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const svg = document.getElementById('svg'), stage = document.getElementById('stage'), card = document.getElementById('card'),
      scr = document.getElementById('scr'), bar = document.getElementById('bar');
const touch = matchMedia('(hover: none)').matches;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const url = id => LIENS[id] ? SITE + LIENS[id] : '';

// Pastilles Spotter / Engineer et logo Pit Box de l'écran
function badge(gid, id, cx, cy, ring) {
  const g = document.getElementById(gid);
  el('circle', {cx, cy, r:50, fill:'#FFFFFF'}, g);
  el('circle', {cx, cy, r:45, fill:'#0B1433', stroke:ring, 'stroke-width':5}, g);
  el('g', {transform:`translate(${cx - 30},${cy - 30}) scale(2.5)`}, g).innerHTML = ICONS[id];
}
badge('b-spotter', 'spotter', 470, 422, '#FD1424');
badge('b-engineer', 'engineer', 1142, 420, '#1C9BE0');
document.getElementById('pbico').innerHTML = ICONS.pitbox;

// LED
const leds = document.getElementById('leds'), LED = [];
for (let i = 0; i < 15; i++) LED.push(el('circle', {cx: 578 + i * 31.7, cy: 217, r: 11, fill: '#E9ECF2'}, leds));
const ledColor = i => i < 5 ? '#3BE37A' : i < 10 ? '#FD1424' : '#1C9BE0';

// Zones + barre d'icônes
const hots = document.getElementById('hots');
MODS.forEach(m => {
  const g = el('g', {class:'hot ' + m.fam, tabindex:0, role:'link', 'aria-label':m.nom}, hots);
  const s = m.shape;
  m.zone = s[0] === 'rect' ? el('rect', {x:s[1], y:s[2], width:s[3], height:s[4], rx:s[5], class:'zone'}, g)
                           : el('circle', {cx:s[1], cy:s[2], r:s[3], class:'zone'}, g);
  if (['spotter','engineer','engine','motion','lab','analyzer'].includes(m.id)) {
    const c = s[0] === 'rect' ? [s[1] + s[3] / 2, s[2] + s[4] / 2] : [s[1], s[2]];
    el('circle', {cx:c[0], cy:c[1], r: s[0] === 'rect' ? 46 : s[3], class:'ping'}, g);
  }
  m.g = g;
  const b = document.createElement('button');
  b.className = 'chip ' + m.fam; b.type = 'button';
  b.innerHTML = `<span class="ico">${icon(m.id)}</span>${m.nom}`;
  bar.appendChild(b); m.chip = b;
  const hover = () => pick(m, true);
  const click = () => { if (touch && cur !== m) { pick(m, true); return; } open(m); };
  [g, b].forEach(x => { x.addEventListener('mouseenter', hover); x.addEventListener('focus', hover); x.addEventListener('click', click);
                         x.addEventListener('keydown', e => { if (e.key === 'Enter' && x === g) open(m); }); });
});
function open(m) { const u = url(m.id); if (!u) return; const a = document.createElement('a'); a.href = u; a.target = '_top'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }

let cur = null, auto = true, idle;
function pick(m, user) {
  if (user) { auto = false; clearTimeout(idle); idle = setTimeout(() => { auto = true; }, 10000); }
  if (cur === m) return; cur = m;
  MODS.forEach(x => { const on = x === m; x.g.classList.toggle('on', on); x.chip.classList.toggle('on', on); stage.classList.toggle('act-' + x.id, on); });
  ['spotter','engineer'].forEach(id => document.getElementById('b-' + id).classList.toggle('on', m.id === id));
  document.getElementById('b-spotter').style.filter = m.id === 'spotter' ? 'drop-shadow(0 0 16px rgba(253,20,36,.95))' : '';
  document.getElementById('b-engineer').style.filter = m.id === 'engineer' ? 'drop-shadow(0 0 16px rgba(28,155,224,.95))' : '';
  scr.dataset.mode = m.id;
  const u = url(m.id);
  const title = m.id === 'pitbox' ? 'PIT <span class="n">BOX</span>' : `PURE<span class="s">|</span><span class="n">${m.nom}</span>`;
  card.innerHTML =
    `<div class="head"><span class="ico">${icon(m.id)}</span><div><div class="fam ${m.fam}"><i></i>${FAM[m.fam]}</div>` +
    `<h2>${title}${m.soon ? '<span class="soon">BIENTÔT</span>' : ''}</h2></div></div>` +
    `<p>${m.txt}</p>` +
    `<div class="where">Sur le volant : <b>${m.where}</b></div>` +
    (u ? `<a class="go" href="${u}" target="_top" rel="noopener">Découvrir ${m.nom}</a>`
       : `<span class="go off">${m.soon ? 'Page bientôt en ligne' : 'Vous êtes sur sa page'}</span>`);
  place();
}
function place() {
  if (!cur || innerWidth <= 1000) { card.classList.add('show'); return; }
  const r = cur.zone.getBoundingClientRect(), st = stage.getBoundingClientRect(), wb = svg.getBoundingClientRect();
  const left = r.left + r.width / 2 < wb.left + wb.width / 2;
  const cy = r.top + r.height / 2 - st.top;
  const top = Math.max(8, Math.min(cy - 60, wb.bottom - st.top - card.offsetHeight));
  card.classList.toggle('left', left); card.classList.toggle('right', !left);
  card.style.left = (left ? 16 : st.width - 280 - 16) + 'px';
  card.style.top = top + 'px';
  card.style.setProperty('--ay', Math.max(18, Math.min(cy - top - 7, card.offsetHeight - 30)) + 'px');
  card.classList.add('show');
}
addEventListener('resize', place);

// Vie de l'écran
let t = 0, gear = 3;
const gearEl = document.getElementById('gear'), speedEl = document.getElementById('speed'), wave = document.getElementById('eng-wave'),
      gdot = document.getElementById('gdot'), ffb = document.getElementById('ffbbar'), ffbt = document.getElementById('ffbtxt');
function tick() {
  t++;
  const rev = (t % 40) / 40;
  LED.forEach((l, i) => l.setAttribute('fill', i / 15 < rev ? ledColor(i) : '#E9ECF2'));
  if (t % 40 === 0) { gear = gear >= 6 ? 3 : gear + 1; gearEl.textContent = gear; }
  speedEl.textContent = Math.round(150 + gear * 18 + rev * 22);
  let d = 'M590,405'; for (let x = 0; x <= 434; x += 6) d += ` L${590 + x},${(405 + Math.sin((x + t * 18) / 15) * 52 * Math.sin(x / 434 * Math.PI)).toFixed(1)}`;
  wave.setAttribute('d', d);
  gdot.setAttribute('cx', 807 + Math.sin(t / 9) * 62); gdot.setAttribute('cy', 405 + Math.sin(t / 5.5) * 42);
  const nm = 4.5 + Math.abs(Math.sin(t / 7)) * 3.6; ffb.setAttribute('width', nm / 9.4 * 414);
  ffbt.textContent = nm.toFixed(1).replace('.', ',') + " Nm · pas d'écrêtage";
}
tick(); if (!reduce) setInterval(tick, 60);

const ORDER = ['pitbox','dash','spotter','engineer','lab','analyzer','engine','motion'].map(id => MODS.find(m => m.id === id));
let k = 0; pick(ORDER[0]);
if (!reduce) setInterval(() => { if (!auto) return; k = (k + 1) % ORDER.length; pick(ORDER[k]); }, 4200);
document.getElementById('hint').textContent = touch ? 'Touchez un élément du volant ou une icône · touchez à nouveau pour ouvrir la page'
                                                    : 'Survolez le volant · cliquez pour ouvrir la page du module';
</script>

</body>
</html>
